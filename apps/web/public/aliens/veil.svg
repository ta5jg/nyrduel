<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" preserveAspectRatio="xMidYMax meet">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a778ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="128" cy="240" rx="70" ry="14" fill="url(#g)" opacity=".5"/>
  <!-- Refraction veil — fanned-out spectral planes diverging from a single
       source point, no body, just light geometry. -->
  <polygon points="128,60 60,200 80,206 128,80" fill="#ff5b3b" opacity=".3"/>
  <polygon points="128,60 80,200 100,210 128,80" fill="#ffce4d" opacity=".3"/>
  <polygon points="128,60 110,210 130,210 128,80" fill="#4dd680" opacity=".35"/>
  <polygon points="128,60 130,210 152,210 128,80" fill="#4ce9d9" opacity=".35"/>
  <polygon points="128,60 158,210 178,210 128,80" fill="#82c8ff" opacity=".3"/>
  <polygon points="128,60 178,210 198,206 128,80" fill="#a778ff" opacity=".3"/>
  <!-- center prism point — pure geometric origin -->
  <polygon points="128,52 138,72 118,72" fill="#fff" stroke="#a778ff" stroke-width="1.5"/>
  <circle cx="128" cy="62" r="3" fill="#fff"/>
  <!-- diffraction lines -->
  <line x1="128" y1="80" x2="60" y2="200" stroke="#fff" stroke-width="0.5" opacity=".5"/>
  <line x1="128" y1="80" x2="100" y2="210" stroke="#fff" stroke-width="0.5" opacity=".5"/>
  <line x1="128" y1="80" x2="156" y2="210" stroke="#fff" stroke-width="0.5" opacity=".5"/>
  <line x1="128" y1="80" x2="196" y2="200" stroke="#fff" stroke-width="0.5" opacity=".5"/>
</svg>
