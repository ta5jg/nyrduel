<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" preserveAspectRatio="xMidYMax meet">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#00d2c0" stop-opacity=".4"/>
      <stop offset="1" stop-color="#00d2c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3070"/>
      <stop offset="1" stop-color="#1a0e2a"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="240" rx="84" ry="14" fill="url(#glow)"/>
  <!-- 11 sinuous tendrils -->
  <path d="M 128 130 Q 60 140 30 220" stroke="#3a2070" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 128 130 Q 70 130 40 200" stroke="#3a2070" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 128 130 Q 80 110 56 70" stroke="#3a2070" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 128 130 Q 100 90 80 50" stroke="#3a2070" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 128 130 Q 116 70 110 30" stroke="#3a2070" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 128 130 Q 140 70 146 30" stroke="#3a2070" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 128 130 Q 156 90 176 50" stroke="#3a2070" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 128 130 Q 176 110 200 70" stroke="#3a2070" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 128 130 Q 186 130 216 200" stroke="#3a2070" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 128 130 Q 196 140 226 220" stroke="#3a2070" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 128 130 L 128 232" stroke="#3a2070" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- phosphorescent dots on tendrils -->
  <circle cx="80" cy="170" r="2" fill="#4ce9d9"/>
  <circle cx="100" cy="80" r="2" fill="#4ce9d9"/>
  <circle cx="170" cy="80" r="2" fill="#4ce9d9"/>
  <circle cx="180" cy="170" r="2" fill="#4ce9d9"/>
  <!-- central body - flat fanged-flower shape -->
  <ellipse cx="128" cy="130" rx="36" ry="28" fill="url(#body)" stroke="#0c0e14" stroke-width="2"/>
  <!-- ring mouth -->
  <circle cx="128" cy="130" r="14" fill="#0c0e14"/>
  <circle cx="128" cy="130" r="10" fill="#00d2c0"/>
  <circle cx="128" cy="130" r="5" fill="#fff"/>
</svg>
