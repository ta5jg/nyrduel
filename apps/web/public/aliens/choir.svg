<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" preserveAspectRatio="xMidYMax meet">
  <defs>
    <radialGradient id="g" cx="50%" cy="100%" r="60%">
      <stop offset="0" stop-color="#4ce9d9" stop-opacity=".4"/>
      <stop offset="1" stop-color="#4ce9d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2244"/>
      <stop offset="1" stop-color="#0c0610"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="240" rx="100" ry="14" fill="url(#g)"/>
  <!-- Five obsidian monoliths in a row, glowing seams running vertically
       through each. No legs, no arms, no faces. -->
  <rect x="34" y="80" width="22" height="140" fill="url(#m)" stroke="#0c0e14" stroke-width="1.5"/>
  <rect x="74" y="60" width="22" height="160" fill="url(#m)" stroke="#0c0e14" stroke-width="1.5"/>
  <rect x="116" y="44" width="24" height="180" fill="url(#m)" stroke="#0c0e14" stroke-width="1.5"/>
  <rect x="160" y="60" width="22" height="160" fill="url(#m)" stroke="#0c0e14" stroke-width="1.5"/>
  <rect x="200" y="80" width="22" height="140" fill="url(#m)" stroke="#0c0e14" stroke-width="1.5"/>
  <!-- vertical glow seam in each -->
  <line x1="45" y1="90" x2="45" y2="218" stroke="#4ce9d9" stroke-width="1.6"/>
  <line x1="85" y1="70" x2="85" y2="218" stroke="#4ce9d9" stroke-width="1.6"/>
  <line x1="128" y1="54" x2="128" y2="222" stroke="#a778ff" stroke-width="2"/>
  <line x1="171" y1="70" x2="171" y2="218" stroke="#4ce9d9" stroke-width="1.6"/>
  <line x1="211" y1="90" x2="211" y2="218" stroke="#4ce9d9" stroke-width="1.6"/>
  <!-- harmonic resonance arcs across tops -->
  <path d="M 45 70 Q 86 30 128 36" stroke="#4ce9d9" stroke-width="1" fill="none" opacity=".7"/>
  <path d="M 128 36 Q 170 30 211 70" stroke="#4ce9d9" stroke-width="1" fill="none" opacity=".7"/>
  <path d="M 85 50 Q 128 22 171 50" stroke="#a778ff" stroke-width="0.9" fill="none" opacity=".6"/>
</svg>
