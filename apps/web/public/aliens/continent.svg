<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" preserveAspectRatio="xMidYMax meet">
  <defs>
    <radialGradient id="g" cx="50%" cy="100%" r="60%">
      <stop offset="0" stop-color="#4ce9d9" stop-opacity=".35"/>
      <stop offset="1" stop-color="#4ce9d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2244"/>
      <stop offset="1" stop-color="#0c0610"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="240" rx="120" ry="16" fill="url(#g)"/>
  <!-- Planetary-scale glyph — large irregular flat geometric mass with
       glowing fissure-runes carved across it. Architecture / cartography,
       not anatomy. -->
  <polygon points="20,170 50,90 100,70 140,80 180,60 220,90 230,160 200,210 130,220 60,210"
           fill="url(#land)" stroke="#0c0e14" stroke-width="2"/>
  <!-- glyph fissures — geometric runes -->
  <line x1="60" y1="120" x2="100" y2="120" stroke="#4ce9d9" stroke-width="2"/>
  <line x1="80" y1="100" x2="80" y2="160" stroke="#4ce9d9" stroke-width="2"/>
  <polygon points="120,110 140,130 120,150 100,130" fill="none" stroke="#a778ff" stroke-width="1.8"/>
  <line x1="160" y1="100" x2="180" y2="100" stroke="#4ce9d9" stroke-width="2"/>
  <line x1="160" y1="120" x2="190" y2="120" stroke="#4ce9d9" stroke-width="2"/>
  <line x1="160" y1="140" x2="170" y2="140" stroke="#4ce9d9" stroke-width="2"/>
  <circle cx="190" cy="160" r="10" fill="none" stroke="#a778ff" stroke-width="1.6"/>
  <circle cx="190" cy="160" r="3" fill="#4ce9d9"/>
  <line x1="100" y1="180" x2="160" y2="180" stroke="#4ce9d9" stroke-width="1.6" opacity=".7"/>
  <!-- coast highlights -->
  <path d="M 20 170 L 50 90 L 100 70 L 140 80 L 180 60 L 220 90"
        stroke="#5a3aa0" stroke-width="1" fill="none" opacity=".7"/>
  <!-- glow points (ancient power nodes) -->
  <circle cx="80" cy="120" r="2" fill="#fff"/>
  <circle cx="120" cy="130" r="2" fill="#fff"/>
  <circle cx="170" cy="100" r="2" fill="#fff"/>
</svg>
