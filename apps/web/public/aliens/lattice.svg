<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" preserveAspectRatio="xMidYMax meet">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#4ce9d9" stop-opacity=".4"/>
      <stop offset="1" stop-color="#4ce9d9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="128" cy="240" rx="80" ry="14" fill="url(#g)"/>
  <!-- Self-assembling tessellation: floating triangles and rhombi at varied
       depths. No anatomy, no centre point of life. -->
  <polygon points="128,40 158,58 158,94 128,112 98,94 98,58" fill="#5a3aa0" stroke="#a778ff" stroke-width="1.5"/>
  <polygon points="60,80 90,98 90,134 60,152 30,134 30,98" fill="#3a2070" stroke="#a778ff" stroke-width="1.4"/>
  <polygon points="196,80 226,98 226,134 196,152 166,134 166,98" fill="#3a2070" stroke="#a778ff" stroke-width="1.4"/>
  <polygon points="80,140 110,158 110,194 80,212 50,194 50,158" fill="#5a3aa0" stroke="#4ce9d9" stroke-width="1.4"/>
  <polygon points="176,140 206,158 206,194 176,212 146,194 146,158" fill="#5a3aa0" stroke="#4ce9d9" stroke-width="1.4"/>
  <polygon points="128,148 158,166 158,202 128,220 98,202 98,166" fill="#7a55b0" stroke="#4ce9d9" stroke-width="1.6"/>
  <!-- connecting energy seams between tiles -->
  <line x1="98" y1="76" x2="60" y2="116" stroke="#4ce9d9" stroke-width="1" opacity=".55"/>
  <line x1="158" y1="76" x2="196" y2="116" stroke="#4ce9d9" stroke-width="1" opacity=".55"/>
  <line x1="128" y1="112" x2="128" y2="148" stroke="#4ce9d9" stroke-width="1" opacity=".55"/>
  <line x1="90" y1="116" x2="80" y2="172" stroke="#4ce9d9" stroke-width="1" opacity=".55"/>
  <line x1="166" y1="116" x2="176" y2="172" stroke="#4ce9d9" stroke-width="1" opacity=".55"/>
  <!-- glow pips at vertices -->
  <circle cx="128" cy="40" r="2" fill="#fff"/>
  <circle cx="60" cy="80" r="2" fill="#fff"/>
  <circle cx="196" cy="80" r="2" fill="#fff"/>
  <circle cx="80" cy="140" r="2" fill="#fff"/>
  <circle cx="176" cy="140" r="2" fill="#fff"/>
</svg>
