<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fdcff"/>
      <stop offset=".55" stop-color="#cfeefb"/>
      <stop offset=".75" stop-color="#dbeed0"/>
      <stop offset="1" stop-color="#7eb464"/>
    </linearGradient>
    <radialGradient id="sun" cx="78%" cy="22%" r="30%">
      <stop offset="0" stop-color="#ffe9b5" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff7d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e9b4d"/>
      <stop offset="1" stop-color="#33623c"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>
  <!-- distant mountains -->
  <path d="M 0 540 L 240 420 L 420 480 L 600 380 L 820 460 L 1040 400 L 1240 470 L 1420 410 L 1600 480 L 1600 600 L 0 600 Z" fill="#8db28e" opacity=".7"/>
  <path d="M 0 600 L 200 510 L 380 560 L 560 480 L 760 540 L 980 470 L 1180 540 L 1360 490 L 1600 560 L 1600 660 L 0 660 Z" fill="#5d8c6c" opacity=".85"/>
  <!-- clouds -->
  <ellipse cx="300" cy="170" rx="120" ry="22" fill="#ffffff" opacity=".88"/>
  <ellipse cx="340" cy="160" rx="80" ry="18" fill="#ffffff" opacity=".95"/>
  <ellipse cx="900" cy="120" rx="140" ry="20" fill="#ffffff" opacity=".82"/>
  <ellipse cx="1320" cy="200" rx="100" ry="18" fill="#ffffff" opacity=".88"/>
  <!-- foreground tree silhouettes -->
  <ellipse cx="80" cy="500" rx="120" ry="180" fill="#1a3826"/>
  <ellipse cx="180" cy="540" rx="90" ry="140" fill="#23472b"/>
  <ellipse cx="1480" cy="500" rx="130" ry="190" fill="#1a3826"/>
  <ellipse cx="1380" cy="560" rx="85" ry="130" fill="#23472b"/>
  <!-- ground -->
  <rect y="660" width="1600" height="240" fill="url(#ground)"/>
  <!-- grass tufts -->
  <g fill="#3f7240" opacity=".7">
    <ellipse cx="280" cy="720" rx="50" ry="6"/>
    <ellipse cx="540" cy="740" rx="60" ry="6"/>
    <ellipse cx="820" cy="725" rx="50" ry="5"/>
    <ellipse cx="1080" cy="745" rx="55" ry="6"/>
    <ellipse cx="1320" cy="725" rx="45" ry="5"/>
  </g>
  <!-- ground horizon highlight -->
  <rect y="660" width="1600" height="3" fill="#a6d18a" opacity=".7"/>
</svg>
