<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" preserveAspectRatio="xMidYMax meet">
  <defs>
    <radialGradient id="glow" cx="50%" cy="100%" r="60%">
      <stop offset="0" stop-color="#ffce4d" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffce4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2a"/>
      <stop offset="1" stop-color="#0c0e14"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="240" rx="50" ry="12" fill="url(#glow)"/>
  <!-- hood -->
  <path d="M 100 90 Q 100 50 128 42 Q 156 50 156 90 L 156 100 L 100 100 Z" fill="url(#body)"/>
  <!-- face shadow -->
  <path d="M 110 70 Q 128 76 146 70 L 146 96 Q 128 106 110 96 Z" fill="#000000"/>
  <!-- two glowing eyes -->
  <circle cx="120" cy="84" r="2.5" fill="#ffce4d"/>
  <circle cx="136" cy="84" r="2.5" fill="#ffce4d"/>
  <!-- body slim crouched -->
  <path d="M 105 100 L 151 100 Q 156 100 156 110 L 152 200 Q 150 220 142 220 L 114 220 Q 106 220 104 200 L 100 110 Q 100 100 105 100 Z" fill="url(#body)"/>
  <!-- left dagger -->
  <line x1="78" y1="160" x2="78" y2="196" stroke="#353a4d" stroke-width="3" stroke-linecap="round"/>
  <line x1="72" y1="156" x2="84" y2="156" stroke="#353a4d" stroke-width="3" stroke-linecap="round"/>
  <!-- right dagger -->
  <line x1="178" y1="160" x2="178" y2="196" stroke="#353a4d" stroke-width="3" stroke-linecap="round"/>
  <line x1="172" y1="156" x2="184" y2="156" stroke="#353a4d" stroke-width="3" stroke-linecap="round"/>
</svg>
