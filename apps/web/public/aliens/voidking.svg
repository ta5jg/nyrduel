  <path d="M 128 130 Q 130 50 150 30" stroke="#3a2270" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 128 130 Q 178 80 196 110 Q 206 140 176 160" stroke="#3a2270" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 128 130 Q 100 200 70 220" stroke="#3a2270" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 128 130 Q 156 200 186 220" stroke="#3a2270" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 128 130 Q 128 210 110 240" stroke="#3a2270" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- central orb -->
  <circle cx="128" cy="130" r="34" fill="url(#orb)" stroke="#0c0e14" stroke-width="2"/>
  <circle cx="128" cy="130" r="48" fill="none" stroke="#a778ff" stroke-width="0.8" stroke-opacity=".5"/>
  <circle cx="128" cy="130" r="58" fill="none" stroke="#a778ff" stroke-width="0.5" stroke-opacity=".3"/>
