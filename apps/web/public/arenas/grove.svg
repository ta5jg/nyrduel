<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1138"/>
      <stop offset=".5" stop-color="#3d2566"/>
      <stop offset="1" stop-color="#6a3a82"/>
    </linearGradient>
    <radialGradient id="moon" cx="20%" cy="20%" r="10%">
      <stop offset="0" stop-color="#fff6d9"/>
      <stop offset=".4" stop-color="#fff0c5" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff0c5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1d4a"/>
      <stop offset="1" stop-color="#10082a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#moon)"/>
  <!-- moon -->
  <circle cx="320" cy="180" r="48" fill="#fff6d9"/>
  <circle cx="305" cy="170" r="6" fill="#0c0e14" opacity=".15"/>
  <circle cx="332" cy="190" r="4" fill="#0c0e14" opacity=".12"/>
  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="80" r="1.5"/>
    <circle cx="540" cy="110" r="1.8"/>
    <circle cx="780" cy="60" r="1.2"/>
    <circle cx="1020" cy="140" r="1.6"/>
    <circle cx="1240" cy="80" r="1.4"/>
    <circle cx="1480" cy="180" r="1.6"/>
    <circle cx="200" cy="240" r="1"/>
    <circle cx="1380" cy="260" r="1.2"/>
    <circle cx="900" cy="200" r="1.4"/>
  </g>
  <!-- distant tree silhouettes -->
  <path d="M 0 580 L 200 430 L 360 540 L 500 420 L 680 540 L 860 420 L 1020 540 L 1200 430 L 1360 540 L 1600 460 L 1600 720 L 0 720 Z" fill="#2a1d4a" opacity=".95"/>
  <!-- foreground big trees -->
  <path d="M -20 720 L 60 320 L 120 720 Z" fill="#10082a"/>
  <ellipse cx="60" cy="330" rx="120" ry="80" fill="#10082a"/>
  <path d="M 1480 720 L 1560 280 L 1620 720 Z" fill="#10082a"/>
  <ellipse cx="1560" cy="290" rx="130" ry="90" fill="#10082a"/>
  <!-- fireflies -->
  <g fill="#fff09a">
    <circle cx="380" cy="500" r="3"/>
    <circle cx="560" cy="600" r="2.5"/>
    <circle cx="740" cy="540" r="3"/>
    <circle cx="920" cy="620" r="2.5"/>
    <circle cx="1080" cy="500" r="3"/>
    <circle cx="1240" cy="580" r="2.5"/>
  </g>
  <g fill="#fff09a" opacity=".4">
    <circle cx="380" cy="500" r="9"/>
    <circle cx="560" cy="600" r="8"/>
    <circle cx="740" cy="540" r="9"/>
    <circle cx="920" cy="620" r="8"/>
    <circle cx="1080" cy="500" r="9"/>
    <circle cx="1240" cy="580" r="8"/>
  </g>
  <!-- ground -->
  <rect y="720" width="1600" height="180" fill="url(#ground)"/>
</svg>
