<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" preserveAspectRatio="xMidYMax meet">
  <defs>
    <radialGradient id="glow" cx="50%" cy="100%" r="60%">
      <stop offset="0" stop-color="#00d2c0" stop-opacity=".3"/>
      <stop offset="1" stop-color="#00d2c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2244"/>
      <stop offset="1" stop-color="#0c0610"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3aa0"/>
      <stop offset="1" stop-color="#1a0e2a"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="240" rx="110" ry="16" fill="url(#glow)"/>
  <!-- mountain-like base -->
  <path d="M 30 220 Q 50 150 80 130 Q 100 110 128 105 Q 156 110 176 130 Q 206 150 226 220 Z" fill="url(#rock)" stroke="#0c0e14" stroke-width="2"/>
  <!-- 5 tower-arms with eye-orbs -->
  <rect x="44" y="110" width="14" height="80" fill="url(#tower)" stroke="#0c0e14" stroke-width="1.5"/>
  <circle cx="51" cy="100" r="9" fill="#4ce9d9"/>
  <circle cx="51" cy="100" r="4" fill="#fff"/>
  <rect x="80" y="80" width="14" height="80" fill="url(#tower)" stroke="#0c0e14" stroke-width="1.5"/>
  <circle cx="87" cy="70" r="9" fill="#00d2c0"/>
  <circle cx="87" cy="70" r="4" fill="#fff"/>
  <rect x="121" y="50" width="14" height="80" fill="url(#tower)" stroke="#0c0e14" stroke-width="1.5"/>
  <circle cx="128" cy="40" r="11" fill="#4ce9d9"/>
  <circle cx="128" cy="40" r="5" fill="#fff"/>
  <rect x="162" y="80" width="14" height="80" fill="url(#tower)" stroke="#0c0e14" stroke-width="1.5"/>
  <circle cx="169" cy="70" r="9" fill="#00d2c0"/>
  <circle cx="169" cy="70" r="4" fill="#fff"/>
  <rect x="198" y="110" width="14" height="80" fill="url(#tower)" stroke="#0c0e14" stroke-width="1.5"/>
  <circle cx="205" cy="100" r="9" fill="#4ce9d9"/>
  <circle cx="205" cy="100" r="4" fill="#fff"/>
  <!-- glowing cracks across base -->
  <path d="M 50 200 L 80 180 L 110 200 L 140 175 L 170 200 L 200 185" stroke="#4ce9d9" stroke-width="1" fill="none" opacity=".6"/>
</svg>
