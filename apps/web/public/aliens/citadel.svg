<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" preserveAspectRatio="xMidYMax meet">
  <defs>
    <radialGradient id="g" cx="50%" cy="100%" r="60%">
      <stop offset="0" stop-color="#a778ff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#a778ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4a6e"/>
      <stop offset="1" stop-color="#1a0e2a"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="240" rx="110" ry="16" fill="url(#g)"/>
  <!-- Multi-layered ziggurat-like fortress. No doors, no windows, no
       limbs. Just an architecture entity. -->
  <rect x="20" y="200" width="216" height="26" fill="url(#s)" stroke="#0c0e14" stroke-width="1.5"/>
  <rect x="36" y="170" width="184" height="30" fill="url(#s)" stroke="#0c0e14" stroke-width="1.5"/>
  <rect x="56" y="140" width="144" height="30" fill="url(#s)" stroke="#0c0e14" stroke-width="1.5"/>
  <rect x="78" y="110" width="100" height="30" fill="url(#s)" stroke="#0c0e14" stroke-width="1.5"/>
  <rect x="100" y="80" width="56" height="30" fill="url(#s)" stroke="#0c0e14" stroke-width="1.5"/>
  <!-- glyphs etched on layers — abstract geometric symbols -->
  <line x1="56" y1="220" x2="78" y2="220" stroke="#4ce9d9" stroke-width="1.4"/>
  <line x1="100" y1="220" x2="122" y2="220" stroke="#4ce9d9" stroke-width="1.4"/>
  <line x1="140" y1="220" x2="162" y2="220" stroke="#4ce9d9" stroke-width="1.4"/>
  <line x1="184" y1="220" x2="206" y2="220" stroke="#4ce9d9" stroke-width="1.4"/>
  <polygon points="86,180 96,190 86,200 76,190" fill="none" stroke="#4ce9d9" stroke-width="1.2"/>
  <polygon points="128,180 138,190 128,200 118,190" fill="none" stroke="#4ce9d9" stroke-width="1.2"/>
  <polygon points="170,180 180,190 170,200 160,190" fill="none" stroke="#4ce9d9" stroke-width="1.2"/>
  <line x1="76" y1="155" x2="96" y2="155" stroke="#a778ff" stroke-width="1.2"/>
  <line x1="120" y1="155" x2="140" y2="155" stroke="#a778ff" stroke-width="1.2"/>
  <line x1="160" y1="155" x2="180" y2="155" stroke="#a778ff" stroke-width="1.2"/>
  <circle cx="128" cy="125" r="6" fill="none" stroke="#4ce9d9" stroke-width="1.4"/>
  <!-- crown spire -->
  <polygon points="118,80 128,52 138,80" fill="#a778ff" stroke="#0c0e14" stroke-width="1.4"/>
  <circle cx="128" cy="48" r="3" fill="#fff"/>
</svg>
