<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4d7a"/>
      <stop offset=".4" stop-color="#a07090"/>
      <stop offset=".75" stop-color="#ffb178"/>
      <stop offset="1" stop-color="#ffd9a0"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="62%" r="14%">
      <stop offset="0" stop-color="#fff5c8"/>
      <stop offset=".5" stop-color="#ffce75" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffce75" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4156"/>
      <stop offset="1" stop-color="#1a1d2a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>
  <!-- distant peaks -->
  <path d="M 0 460 L 180 280 L 320 380 L 480 240 L 660 360 L 840 220 L 1020 360 L 1200 280 L 1380 360 L 1600 300 L 1600 660 L 0 660 Z" fill="#52597a" opacity=".85"/>
  <!-- snow caps -->
  <path d="M 165 305 L 190 260 L 220 305 Z" fill="#ffffff" opacity=".85"/>
  <path d="M 462 270 L 488 230 L 520 270 Z" fill="#ffffff" opacity=".85"/>
  <path d="M 822 250 L 848 215 L 882 250 Z" fill="#ffffff" opacity=".85"/>
  <path d="M 1180 305 L 1208 270 L 1240 305 Z" fill="#ffffff" opacity=".85"/>
  <!-- closer peaks -->
  <path d="M 0 600 L 220 460 L 420 540 L 620 420 L 820 520 L 1040 440 L 1240 540 L 1440 460 L 1600 540 L 1600 700 L 0 700 Z" fill="#2c3243" opacity=".95"/>
  <!-- clouds -->
  <ellipse cx="240" cy="240" rx="130" ry="14" fill="#ffe0c2" opacity=".85"/>
  <ellipse cx="1220" cy="180" rx="160" ry="14" fill="#ffd0a8" opacity=".7"/>
  <!-- ground -->
  <rect y="700" width="1600" height="200" fill="url(#ground)"/>
  <!-- ground specks -->
  <g fill="#4d5470" opacity=".5">
    <ellipse cx="320" cy="780" rx="60" ry="4"/>
    <ellipse cx="780" cy="800" rx="80" ry="5"/>
    <ellipse cx="1240" cy="775" rx="50" ry="4"/>
  </g>
</svg>
