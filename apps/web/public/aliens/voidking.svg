      <stop offset="0" stop-color="#a778ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#a778ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".3" stop-color="#4ce9d9"/>
      <stop offset=".8" stop-color="#00d2c0"/>
