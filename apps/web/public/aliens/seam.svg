<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" preserveAspectRatio="xMidYMax meet">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#a778ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a778ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0610"/>
      <stop offset=".5" stop-color="#3a2070"/>
      <stop offset="1" stop-color="#0c0610"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="240" rx="50" ry="14" fill="url(#g)"/>
  <!-- A vertical jagged tear in space. No body. The threat IS the seam. -->
  <path d="M 128 30 L 134 50 L 122 80 L 138 110 L 118 140 L 140 170 L 116 200 L 132 226"
