<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" preserveAspectRatio="xMidYMax meet">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#a778ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#a778ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".4" stop-color="#a778ff"/>
      <stop offset="1" stop-color="#0c0e14"/>
    </radialGradient>
  </defs>
  <ellipse cx="128" cy="240" rx="60" ry="14" fill="url(#g)"/>
  <!-- Singularity point at the centre, surrounded by 5 orbital arcs at
       varied radii and tilts. No anatomy, just gravitational architecture. -->
  <ellipse cx="128" cy="130" rx="98" ry="22" fill="none" stroke="#7a55b0" stroke-width="1.4" opacity=".75"/>
  <ellipse cx="128" cy="130" rx="86" ry="60" fill="none" stroke="#a778ff" stroke-width="1.4" opacity=".7" transform="rotate(20 128 130)"/>
  <ellipse cx="128" cy="130" rx="86" ry="60" fill="none" stroke="#4ce9d9" stroke-width="1.2" opacity=".65" transform="rotate(-20 128 130)"/>
  <ellipse cx="128" cy="130" rx="68" ry="86" fill="none" stroke="#a778ff" stroke-width="1.4" opacity=".5"/>
  <ellipse cx="128" cy="130" rx="44" ry="44" fill="none" stroke="#4ce9d9" stroke-width="1.6" opacity=".7"/>
  <!-- orbiting glints -->
  <circle cx="226" cy="130" r="3" fill="#fff"/>
  <circle cx="180" cy="80" r="2.5" fill="#4ce9d9"/>
  <circle cx="60" cy="190" r="3" fill="#fff"/>
  <circle cx="80" cy="80" r="2.5" fill="#4ce9d9"/>
  <circle cx="170" cy="180" r="2" fill="#fff"/>
  <!-- central singularity -->
  <circle cx="128" cy="130" r="22" fill="url(#core)" stroke="#0c0e14" stroke-width="1.5"/>
  <circle cx="128" cy="130" r="6" fill="#0c0e14"/>
</svg>
