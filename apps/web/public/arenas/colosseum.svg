<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb478"/>
      <stop offset=".5" stop-color="#ffd9a0"/>
      <stop offset="1" stop-color="#fff0d4"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c19868"/>
      <stop offset="1" stop-color="#8a6a44"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dec8a7"/>
      <stop offset="1" stop-color="#998060"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- distant city silhouette -->
  <g fill="#7c5a3a" opacity=".55">
    <rect x="100" y="540" width="60" height="80"/>
    <polygon points="100,540 130,520 160,540"/>
    <rect x="220" y="520" width="80" height="100"/>
    <polygon points="220,520 260,490 300,520"/>
    <rect x="380" y="540" width="50" height="80"/>
    <rect x="1180" y="530" width="70" height="90"/>
    <polygon points="1180,530 1215,510 1250,530"/>
    <rect x="1340" y="520" width="80" height="100"/>
    <polygon points="1340,520 1380,490 1420,520"/>
  </g>
  <!-- distant arena ring -->
  <rect x="500" y="480" width="600" height="180" fill="#7c5a3a" opacity=".6"/>
  <g fill="#7c5a3a" opacity=".7">
    <rect x="510" y="500" width="20" height="80"/>
    <rect x="555" y="500" width="20" height="80"/>
    <rect x="600" y="500" width="20" height="80"/>
    <rect x="645" y="500" width="20" height="80"/>
    <rect x="690" y="500" width="20" height="80"/>
    <rect x="735" y="500" width="20" height="80"/>
    <rect x="780" y="500" width="20" height="80"/>
    <rect x="825" y="500" width="20" height="80"/>
    <rect x="870" y="500" width="20" height="80"/>
    <rect x="915" y="500" width="20" height="80"/>
    <rect x="960" y="500" width="20" height="80"/>
    <rect x="1005" y="500" width="20" height="80"/>
    <rect x="1050" y="500" width="20" height="80"/>
  </g>
  <!-- foreground columns -->
  <rect x="80" y="380" width="60" height="380" fill="url(#stone)"/>
  <rect x="74" y="370" width="72" height="20" fill="#dec8a7"/>
  <rect x="74" y="760" width="72" height="20" fill="#dec8a7"/>
  <rect x="1460" y="380" width="60" height="380" fill="url(#stone)"/>
  <rect x="1454" y="370" width="72" height="20" fill="#dec8a7"/>
  <rect x="1454" y="760" width="72" height="20" fill="#dec8a7"/>
  <!-- arena floor -->
  <rect y="660" width="1600" height="240" fill="url(#ground)"/>
  <!-- floor tiles hint -->
  <g stroke="#8a6a44" stroke-width="1" opacity=".4">
    <line x1="0" y1="720" x2="1600" y2="720"/>
    <line x1="0" y1="780" x2="1600" y2="780"/>
    <line x1="0" y1="840" x2="1600" y2="840"/>
    <line x1="200" y1="660" x2="200" y2="900"/>
    <line x1="500" y1="660" x2="500" y2="900"/>
    <line x1="800" y1="660" x2="800" y2="900"/>
    <line x1="1100" y1="660" x2="1100" y2="900"/>
    <line x1="1400" y1="660" x2="1400" y2="900"/>
  </g>
  <!-- sand drifts -->
  <ellipse cx="450" cy="780" rx="160" ry="6" fill="#a87f4f" opacity=".5"/>
  <ellipse cx="1100" cy="800" rx="180" ry="7" fill="#a87f4f" opacity=".5"/>
</svg>
