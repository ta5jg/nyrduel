<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" preserveAspectRatio="xMidYMax meet">
  <defs>
    <radialGradient id="glow" cx="50%" cy="100%" r="60%">
      <stop offset="0" stop-color="#a778ff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#a778ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2a"/>
      <stop offset="1" stop-color="#0c0e14"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".4" stop-color="#a778ff"/>
      <stop offset="1" stop-color="#5a3aa0"/>
    </radialGradient>
  </defs>
  <ellipse cx="128" cy="240" rx="60" ry="14" fill="url(#glow)"/>
  <!-- pointed hat -->
  <path d="M 96 60 Q 128 -14 160 60 Q 158 70 128 70 Q 98 70 96 60 Z" fill="#1a1d2a"/>
  <ellipse cx="128" cy="68" rx="34" ry="6" fill="#0c0e14"/>
  <path d="M 124 8 Q 138 16 132 24 L 122 32 Q 116 36 122 14 Z" fill="#262a38"/>
  <!-- head -->
  <circle cx="128" cy="84" r="20" fill="url(#body)"/>
  <!-- robe (widens at bottom) -->
  <path d="M 110 100 L 146 100 L 168 220 Q 162 230 152 230 L 104 230 Q 94 230 88 220 L 110 100 Z" fill="url(#body)"/>
  <!-- staff -->
  <line x1="180" y1="56" x2="180" y2="220" stroke="#353a4d" stroke-width="5" stroke-linecap="round"/>
  <circle cx="180" cy="50" r="14" fill="url(#orb)" stroke="#a778ff" stroke-width="1.5"/>
  <circle cx="180" cy="50" r="22" fill="none" stroke="#a778ff" stroke-width=".6" stroke-opacity=".5"/>
</svg>
