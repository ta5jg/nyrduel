<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f2c"/>
      <stop offset=".5" stop-color="#3a4357"/>
      <stop offset="1" stop-color="#586379"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4357"/>
      <stop offset="1" stop-color="#1a1f2c"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- heavy clouds -->
  <ellipse cx="300" cy="200" rx="220" ry="50" fill="#23293a" opacity=".95"/>
  <ellipse cx="600" cy="170" rx="240" ry="55" fill="#23293a" opacity=".9"/>
  <ellipse cx="950" cy="190" rx="260" ry="60" fill="#23293a" opacity=".95"/>
  <ellipse cx="1320" cy="210" rx="220" ry="50" fill="#23293a" opacity=".9"/>
  <!-- lightning -->
  <path d="M 750 220 L 720 380 L 760 380 L 700 580" stroke="#ffe066" stroke-width="4" fill="none" stroke-linecap="round" opacity=".9"/>
  <path d="M 750 220 L 720 380 L 760 380 L 700 580" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- lightning glow -->
  <path d="M 750 220 L 720 380 L 760 380 L 700 580" stroke="#fff5b5" stroke-width="14" fill="none" stroke-linecap="round" opacity=".25"/>
  <!-- horizon line / sea -->
  <rect x="0" y="600" width="1600" height="60" fill="#2a3147"/>
  <!-- waves -->
  <g fill="#4d5773" opacity=".6">
    <ellipse cx="200" cy="620" rx="120" ry="4"/>
    <ellipse cx="500" cy="630" rx="140" ry="4"/>
    <ellipse cx="900" cy="625" rx="160" ry="4"/>
    <ellipse cx="1300" cy="635" rx="120" ry="4"/>
  </g>
  <!-- rain -->
  <g stroke="#82a4d8" stroke-width="1.5" opacity=".4">
    <line x1="180" y1="280" x2="160" y2="350"/>
    <line x1="360" y1="220" x2="340" y2="310"/>
    <line x1="540" y1="320" x2="520" y2="400"/>
    <line x1="900" y1="260" x2="880" y2="350"/>
    <line x1="1140" y1="300" x2="1120" y2="380"/>
    <line x1="1320" y1="240" x2="1300" y2="330"/>
    <line x1="1480" y1="320" x2="1460" y2="400"/>
  </g>
  <!-- ground -->
  <rect y="660" width="1600" height="240" fill="url(#ground)"/>
  <!-- puddles -->
  <ellipse cx="380" cy="780" rx="80" ry="6" fill="#4d5773" opacity=".6"/>
  <ellipse cx="900" cy="800" rx="100" ry="7" fill="#4d5773" opacity=".5"/>
  <ellipse cx="1280" cy="780" rx="70" ry="5" fill="#4d5773" opacity=".6"/>
</svg>
